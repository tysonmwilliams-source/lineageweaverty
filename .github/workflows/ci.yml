name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Blocking from day one of decision F4, and it has to be: **Vite strips
      # TypeScript types without checking them**, so `npm run build` passing
      # says nothing at all about type correctness. Without this step the
      # migration would produce the appearance of type safety rather than the
      # fact of it.
      - run: npm run typecheck

      - run: npm run test:run

      # Blocking as of decision F3. `no-unused-vars` and the React Compiler rules
      # are warnings; no-undef, no-dupe-keys and rules-of-hooks are hard errors.
      # A new undefined identifier or hook-order violation now fails the build.
      - run: npm run lint
