name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test:run

      # Lint is not a gate yet: `no-unused-vars` is set to `error` and there are
      # several hundred pre-existing violations, so a blocking lint step would
      # fail every run. Reported for visibility; see audit decision F3 for
      # whether to downgrade the rule or bulk-fix first.
      - run: npm run lint
        continue-on-error: true
